<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Attendance</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2ef;--card:#fff;--ink:#16231e;--mute:#66766f;--line:#e0e7e2;--soft:#f5f8f6;--accent:#127a5c;--onacc:#fff;
--P:#2e9e68;--A:#d4493e;--H:#e0a122;--L:#3a7bc8;--sh:0 1px 2px rgba(20,40,30,.06),0 4px 16px rgba(20,40,30,.05)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211d;--ink:#e8f0ec;--mute:#8fa39a;--line:#26332d;--soft:#1e2923;--accent:#4fd1a5;--onacc:#07241a;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211d;--ink:#e8f0ec;--mute:#8fa39a;--line:#26332d;--soft:#1e2923;--accent:#4fd1a5;--onacc:#07241a;--sh:none}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,Roboto,Arial,sans-serif;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--onacc);display:grid;place-items:center;font-size:20px}
h1{font-size:19px;margin:0;line-height:1.1}
.sub{font-size:12.5px;color:var(--mute)}
#sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:99px}
#sync:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--H)}
#sync.ok:before{background:var(--P)}
.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;transition:background .15s,transform .05s}
button:hover{background:var(--soft)}
button:active{transform:scale(.97)}
button.pri{background:var(--accent);color:var(--onacc);border-color:var(--accent);font-weight:600}
button.pri:hover{filter:brightness(1.07)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=password],input[type=number],input[type=time]{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;min-width:0}
.add{display:flex;gap:6px;margin-bottom:12px}
.add input{flex:1}
.staff{list-style:none;margin:0;padding:0;display:grid;gap:4px}
@media(max-width:800px){.staff{display:flex;overflow-x:auto;padding-bottom:4px}.staff li{flex:none}}
.staff li{display:flex;align-items:center;border-radius:12px;border:1px solid transparent}
.staff li.on{background:var(--soft);border-color:var(--line)}
.staff .nm{flex:1;display:flex;align-items:center;gap:10px;border:none;background:transparent;text-align:left;padding:8px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.staff .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.staff li.on .t{font-weight:700}
.x{border:none!important;background:transparent!important;color:var(--mute);padding:6px 8px;opacity:.6}
.x:hover{opacity:1;color:var(--A)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.bar h3{flex:1;text-align:center;margin:0;font-size:18px}
.ib{width:38px;height:38px;padding:0;font-size:18px}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hero .av{width:46px;height:46px;font-size:17px}
.hero b{font-size:17px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px;width:180px;max-width:100%}
.prog i{display:block;height:100%;background:var(--P);border-radius:9px}
.brush{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.brush .lbl{font-size:12.5px;color:var(--mute);margin-right:2px}
.chip{display:flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;font-size:13.5px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.chip.hm.on{background:var(--H);color:#fff;border-color:var(--H);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dh{text-align:center;font-size:11.5px;color:var(--mute);padding:2px 0;font-weight:600}
.day{aspect-ratio:1/.9;border-radius:12px;border:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;padding:0;position:relative;gap:1px}
.day small{font-size:10.5px;font-weight:600;opacity:.95}
.day.empty{visibility:hidden}
.day.P,.day.A,.day.H,.day.L{color:#fff;border-color:transparent}
.day.P{background:var(--P)}.day.A{background:var(--A)}.day.H{background:var(--H)}.day.L{background:var(--L)}
.day.off{background:transparent;border-style:dashed;color:var(--mute);font-weight:500}
.day.hol{background:transparent;border:1px dashed var(--H);color:var(--H)}
.day.today:after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px var(--card)}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.day.sel{outline:2px solid var(--ink);outline-offset:2px}
.day .tdot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.8}
.hint{font-size:12.5px;color:var(--mute);margin:10px 0 0}
.panel{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:14px}
.panel label{display:flex;gap:6px;align-items:center;color:var(--mute)}
.panel b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:14px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-size:20px}
.stat.c{border-left:4px solid var(--c)}
.pay{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.pay .big{font-size:24px;font-weight:700;color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:14px}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tools .danger{color:var(--A)}
.tw{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:600}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.on{background:var(--soft)}
.empty-msg{text-align:center;padding:48px 16px;color:var(--mute)}
.empty-msg .big{font-size:42px}
.empty-msg b{display:block;color:var(--ink);font-size:17px;margin:6px 0 4px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:30;background:rgba(10,20,15,.5)}
.ov[hidden]{display:none}
#gate{background:var(--bg);z-index:40}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.18);margin:auto}
.gt{font-size:20px;text-align:center;margin:0 0 4px}
.gs{font-size:13.5px;color:var(--mute);text-align:center;margin:0 0 16px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fld{display:grid;gap:5px;margin-bottom:12px;font-size:13px;color:var(--mute)}
.fld input{width:100%}
.pw{position:relative;display:block}
.pw input{padding-right:62px}
.pw .tg{position:absolute;right:4px;top:4px;bottom:4px;border:none;background:transparent;color:var(--accent);padding:0 10px;font-size:13px}
.err{color:var(--A);font-size:13px;min-height:18px;margin-bottom:8px}
.full{width:100%;padding:12px}
.lnk{background:none;border:none;color:var(--accent);padding:4px;text-decoration:underline;font-size:13.5px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:12px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.code{font:700 22px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;background:var(--soft);border:1px dashed var(--accent);border-radius:12px;padding:14px;margin:12px 0;user-select:all}
.ok{color:var(--P);font-size:13px;margin:8px 0}
@media(max-width:520px){.hl{display:none}}
.ur{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.un{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink)}
.rf{display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.rf input{flex:1}
.badge{font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--mute);margin-left:6px}
body.ro .brush,body.ro .add,body.ro .staff .x,body.ro #allP,body.ro #clr,body.ro .opts{display:none}
body.ro .day{pointer-events:none}
body.ro #sal,body.ro #ti,body.ro #to{pointer-events:none;opacity:.7}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;transition:grid-template-columns .2s}
.shell.col{grid-template-columns:78px 1fr}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:16px 12px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto}
.brandrow{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.logo{overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.brand-t b{display:block;font-size:15px;line-height:1.15}
.brand-t small{font-size:11.5px}
#nav{display:grid;gap:4px}
.ni{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;padding:11px 12px;border-radius:12px;color:var(--mute);font-weight:500;text-align:left}
.ni:hover{background:var(--soft);color:var(--ink)}
.ni.on{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-weight:700}
.sidefoot{margin-top:auto;display:grid;gap:8px}
.uchip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--soft)}
.uchip b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.uchip small{color:var(--mute);font-size:11.5px}
.sob{display:flex;align-items:center;gap:10px;justify-content:center}
.colb{background:transparent;border:none;color:var(--mute);font-size:18px}
.shell.col .nl,.shell.col .brand-t{display:none}
.shell.col .ni,.shell.col .uchip{justify-content:center;padding-left:8px;padding-right:8px}
.shell.col .colb{transform:rotate(180deg)}
.content{padding:22px;max-width:1120px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:26px;letter-spacing:-.01em}
.tr{display:flex;gap:8px;align-items:center}
.mo{display:none}
#main>.card,#main>.acc{margin-bottom:14px}
.hello{margin-bottom:14px}.hello h2{font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 2px}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trow:last-child{border-bottom:none}
.qb{display:flex;gap:6px;margin-left:auto}
.qb button{width:38px;height:34px;padding:0;border-radius:99px;font-weight:700}
.qb button.on{color:#fff;border-color:transparent}
.mrow{display:grid;grid-template-columns:130px 1fr 54px 90px;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.mrow .prog{width:auto}
@media(max-width:560px){.mrow{grid-template-columns:90px 1fr 44px}.mrow .pa{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.sc{display:flex;align-items:center;gap:8px;border-radius:99px;padding:5px 12px 5px 5px;white-space:nowrap}
.sc .av{width:26px;height:26px;font-size:11px}
.sc.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.srow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow .sn{flex:1;min-width:140px}.srow .ss{width:120px}
.srow .sub{min-width:120px}
.cardh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cardh .add{margin:0}
.acc{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;box-shadow:var(--sh)}
.acc summary,.ud summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.acc summary::-webkit-details-marker,.ud summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--soft)}
.ai{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--accent) 14%,transparent);display:grid;place-items:center;font-size:18px;flex:none}
.at{flex:1;min-width:0}.at small{display:block;color:var(--mute);font-size:12.5px;font-weight:400}
.chev{font-size:24px;color:var(--mute);transition:transform .2s;line-height:1}
details[open]>summary .chev{transform:rotate(90deg)}
.ab{padding:4px 16px 16px;border-top:1px solid var(--line)}
.ud{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--soft)}
.ud summary{padding:10px 12px}.ud .ab{background:var(--card);border-radius:0 0 12px 12px}
.acc input[type=text],.acc input[type=password],.acc select{width:100%}
.acc .frow input,.acc .frow select{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:9px 16px;background:var(--card)}
.seg button.on{background:var(--accent);color:var(--onacc);font-weight:600}
.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer}
.frow{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.frow label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.lab{font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:600}
.uplb span{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--card)}
.uplb span:hover{background:var(--soft)}
#idle{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);width:max-content;max-width:94vw}
#idle[hidden]{display:none}
#idle button{padding:5px 12px}
#gate{--ink:#fff;--mute:rgba(255,255,255,.72);--line:rgba(255,255,255,.2);--soft:rgba(255,255,255,.1);--card:rgba(10,20,16,.55);background:color-mix(in srgb,var(--accent) 22%,#040a07);overflow:hidden}
#gate .box{position:relative;z-index:1;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border-color:rgba(255,255,255,.2);max-height:100%;overflow-y:auto}
#gate .tg,#gate .lnk{color:#fff}
#gate input::placeholder{color:rgba(255,255,255,.45)}
#gate button.pri{box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.wall{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.wall i{position:absolute;border-radius:50%;background:var(--accent);filter:blur(80px);opacity:.55;animation:drift 20s ease-in-out infinite alternate}
.wall i:nth-child(1){width:52vmax;height:52vmax;left:-14vmax;top:-18vmax}
.wall i:nth-child(2){width:44vmax;height:44vmax;right:-12vmax;bottom:-14vmax;filter:blur(80px) hue-rotate(70deg);animation-duration:26s}
.wall i:nth-child(3){width:34vmax;height:34vmax;left:35%;top:40%;filter:blur(90px) hue-rotate(-60deg);opacity:.4;animation-duration:32s;animation-direction:alternate-reverse}
.wall canvas{position:absolute;inset:0}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmax,6vmax) scale(1.2)}}
@media(prefers-reduced-motion:reduce){.wall i{animation:none}}
@media(max-width:800px){
.shell,.shell.col{grid-template-columns:1fr}
.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:none;border-top:1px solid var(--line);z-index:20;overflow:visible}
.brandrow,.sidefoot{display:none}
#nav{display:flex;width:100%;justify-content:space-around}
.ni,.shell.col .ni{flex-direction:column;gap:2px;padding:6px 8px;font-size:11px;width:auto;justify-content:center}
.shell.col .nl{display:block}
.content{padding:14px 14px 96px}
.mo{display:inline-flex;align-items:center;justify-content:center}
.top h1{font-size:22px}}
body.locked .shell{display:none}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side">
    <div class="brandrow"><div class="logo"></div><div class="brand-t"><b class="bn"></b><small class="sub">Attendance &amp; payroll</small></div></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="sidefoot"><div class="uchip" id="uchip"></div><button id="so2" class="sob" title="Sign out">&#8618; <span class="nl">Sign out</span></button><button id="colb" class="colb" title="Collapse menu" aria-label="Collapse menu">&#171;</button></div>
  </aside>
  <div class="content">
    <div class="top"><div><h1 id="pt"></h1><div class="sub" id="ps"></div></div><div class="tr"><div id="sync">Saved on this device</div><button id="mode" class="ib" aria-label="Toggle dark mode" title="Toggle dark mode"></button><button id="so3" class="ib mo" aria-label="Sign out" title="Sign out">&#8618;</button></div></div>
    <main id="main"></main>
  </div>
</div>
<div id="gate" class="ov" hidden></div>
<div id="idle" hidden role="alert"><span>Signing out in <b id="is">30</b>s due to inactivity.</span><button class="pri" id="stay">Stay signed in</button></div>
<div id="toast" role="status"></div>
<script>
(function(){
var KEY='attendance-v2', S={staff:[],rec:{},tm:{},hol:{},users:[],set:{sunOff:true,leavePaid:true,idle:5},theme:{}}, sel=null, selDay=null, holMode=false, brush='P', cur=new Date(); cur.setDate(1);
var NAMES={P:'Present',A:'Absent',H:'Half day',L:'Leave'}, COL=['#2e9e68','#3a7bc8','#c0562f','#8a5cc2','#d08a1c','#2b9aa0','#c24a7a'];
var dl=null,dbDoc=null,lastJson='',timer=null,syncMsg='Saved on this device',syncOk=false,tt=null;

function mk(){return cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');}
function dk(d){return mk()+'-'+String(d).padStart(2,'0');}
function wd(d){return new Date(cur.getFullYear(),cur.getMonth(),d).getDay();}
function get(id,d){return (S.rec[id]||{})[dk(d)]||'';}
function isOff(d){return (S.set.sunOff&&wd(d)===0)||!!S.hol[dk(d)];}
function mins(id,d){var t=(S.tm[id]||{})[dk(d)];if(!t||!t.i||!t.o)return 0;var a=t.i.split(':'),b=t.o.split(':');var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);return m>0?m:0;}

function ini(n){var p=n.trim().split(/\s+/);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
function colr(id){var h=0;for(var i=0;i<id.length;i++)h+=id.charCodeAt(i);return COL[h%COL.length];}
function stats(s,n){
  var c={P:0,A:0,H:0,L:0,off:0,un:0,min:0};
  for(var i=1;i<=n;i++){var v=get(s.id,i);if(v)c[v]++;else if(isOff(i))c.off++;else c.un++;c.min+=mins(s.id,i);}
  c.paid=c.P+c.H/2+c.off+(S.set.leavePaid?c.L:0);
  c.pay=s.sal?Math.round(s.sal/n*c.paid):0;

}

function report(){

  var r=['Attendance report - '+title,'',csvRow(['Name','Present','Absent','Half day','Leave','Off days','Not marked','Hours','Monthly salary','Paid days','Payable'])];
  S.staff.forEach(function(s){var k=stats(s,n);r.push(csvRow([s.name,k.P,k.A,k.H,k.L,k.off,k.un,fmtH(k.min),s.sal||'',k.paid,s.sal?k.pay:'']));});
  r.push('','Daily detail',csvRow(['Name','Date','Day','Status','In','Out','Hours']));
  var dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  S.staff.forEach(function(s){for(var d=1;d<=n;d++){var v=get(s.id,d),t=(S.tm[s.id]||{})[dk(d)]||{},m=mins(s.id,d);
    r.push(csvRow([s.name,dk(d),dn[wd(d)],v?NAMES[v]:(S.hol[dk(d)]?'Holiday: '+S.hol[dk(d)]:(isOff(d)?'Off':'Not marked')),t.i||'',t.o||'',m?fmtH(m):'']));}});

function rnd(n){var a=new Uint8Array(n),o='';crypto.getRandomValues(a);for(var i=0;i<n;i++)o+=('0'+a[i].toString(16)).slice(-2);return o;}

  if(!(window.crypto&&crypto.subtle)){var x=5381;(salt+p).split('').forEach(function(c){x=((x<<5)+x+c.charCodeAt(0))|0;});return 'f'+x;}

    if(p.length<6)return err('Password must be at least 6 characters.');
    var r=await mkUser(n,p,$('ar').value);S.users.push(r.u);save();userNote=codeNote('User <b>'+esc(n)+'</b> added.',r.rc);openSet.addu=true;openSet.users=true;render();toast(n+' added');};
  if($('bk'))$('bk').onclick=function(){var d={staff:S.staff,rec:S.rec,tm:S.tm,hol:S.hol,set:S.set,theme:S.theme};dl.save({filename:'attendance-backup-'+tkey()+'.json',data:JSON.stringify(d,null,2)}).then(function(){toast('Backup downloaded');}).catch(function(e){if(!e||e.code!=='declined')toast('Could not download');});};
}

/* ---------- Auto sign-out when idle ---------- */
var lastAct=Date.now();
function act(){lastAct=Date.now();}
['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(function(e){window.addEventListener(e,act,{passive:true,capture:true});});
setInterval(function(){
  var bar=$('idle');if(!unlocked){bar.hidden=true;return;}
  var m=+S.set.idle;if(!m){bar.hidden=true;return;}
  var left=m*60000-(Date.now()-lastAct);
  if(left<=0){bar.hidden=true;gnote='You were signed out after '+m+' minute'+(m>1?'s':'')+' of inactivity.';signOut();return;}
  if(left<=30000){bar.hidden=false;$('is').textContent=Math.ceil(left/1000);}else bar.hidden=true;
},1000);
$('stay').onclick=function(){act();$('idle').hidden=true;};

/* ---------- Login wallpaper ---------- */
var wallTok=0,WALL='<div class="wall"><i></i><i></i><i></i><canvas id="wc"></canvas></div>';
function startWall(){
  var cv=$('wc');if(!cv)return;var tok=++wallTok,x=cv.getContext('2d'),W=0,H=0,P=[],reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  size();window.onresize=size;
  var N=Math.min(70,Math.round(W*H/20000))+14;
  for(var i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,r:Math.random()*1.8+.6});
  function draw(){
    if(tok!==wallTok||$('gate').hidden)return;
    x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;}
      x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
      for(var j=i+1;j<P.length;j++){var q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<14400){x.strokeStyle='rgba(255,255,255,'+(0.22*(1-d/14400)).toFixed(3)+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}}}
    if(!reduce)requestAnimationFrame(draw);
  }
  draw();
}

/* ---------- Init ---------- */
try{if(localStorage.getItem('att-col')==='1')$('shell').classList.add('col');}catch(e){}
$('colb').onclick=function(){var c=$('shell').classList.toggle('col');try{localStorage.setItem('att-col',c?'1':'0');}catch(e){}};
$('mode').onclick=function(){setMode(isDark()?'light':'dark');render();};
$('so2').onclick=signOut;$('so3').onclick=signOut;
applyMode();applyTheme();
checkGate();
try{
  if(window.claude&&claude.use){claude.use('db').then(function(db){
    if(!db){onReady();return;}
    dbDoc=db.doc('app/state');
    dbDoc.onSnapshot(function(snap){
      setSync('Synced with your team',true);
      if(!snap.exists){if(S.staff.length||S.users.length){save();}onReady();return;}
      var j=JSON.stringify(snap.data());
      if(j!==lastJson){
        lastJson=j;var keep=S.users;S=norm(JSON.parse(j));
        if(!S.users.length&&keep.length){S.users=keep;save();}
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
        if(!S.staff.some(function(x){return x.id===sel;}))sel=S.staff.length?S.staff[0].id:null;
      }
      onReady();
      if(unlocked&&!me()){lockNow();return;}
      applyTheme();if(unlocked)applyRole();
      if(!unlocked&&gmode!=='code'&&gmode!=='forgot'&&desired()!==gmode&&!(desired()==='in'&&gmode==='in'))checkGate();
      var ae=document.activeElement;if(ae&&ae.tagName==='INPUT')return;if(unlocked)render();
    },function(){setSync('Sync failed, saved on this device');onReady();});
  }).catch(function(){onReady();});}
}catch(e){}
setTimeout(onReady,3000);
try{if(window.claude&&claude.use){claude.use('downloads').then(function(d){if(d){dl=d;var ae=document.activeElement;if(!(ae&&ae.tagName==='INPUT'))render();}}).catch(function(){});}}catch(e){}
setSync(syncMsg,syncOk);
})();
</script>
